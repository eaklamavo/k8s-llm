# ClusterIP - internal only. OpenWebUI reaches Ollama via http://ollama:11434
# This is intentional: model backends are not exposed publicly, only
# OpenWebUI is. Separation of concerns, the serving
# layer is internal, the UI is the only public surface.
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: ai-demos
  labels:
    app: ollama
spec:
  type: ClusterIP
  selector:
    app: ollama
  ports:
    - name: http
      port: 11434
      targetPort: 11434

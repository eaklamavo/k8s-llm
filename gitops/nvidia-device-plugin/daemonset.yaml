# =============================================================================
# NVIDIA Device Plugin DaemonSet
#
# Runs on every GPU node and registers nvidia.com/gpu as a schedulable
# Kubernetes resource. Without this, the scheduler has no knowledge of
# GPUs and cannot place GPU-requesting pods.
#
# Kubernetes doesn't understand GPUs natively. 
# This DaemonSet is the device plugin
# that advertises nvidia.com/gpu to the kubelet. After it starts:
#   kubectl describe node <gpu-node> | grep nvidia.com/gpu
# ...will show nvidia.com/gpu: 1 in Allocatable.
#
# Only runs on GPU nodes via the tolerations + nodeSelector below.
# =============================================================================
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-device-plugin-daemonset
  namespace: kube-system
spec:
  selector:
    matchLabels:
      name: nvidia-device-plugin-ds
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        name: nvidia-device-plugin-ds
    spec:
      tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: present
          effect: NoSchedule
        - key: DeletionCandidateOfClusterAutoscaler
          operator: Exists
          effect: PreferNoSchedule
      priorityClassName: system-node-critical
      containers:
        - image: nvcr.io/nvidia/k8s-device-plugin:v0.17.0
          name: nvidia-device-plugin-ctr
          env:
            - name: FAIL_ON_INIT_ERROR
              value: "false"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
      nodeSelector:
        agentpool: gpu
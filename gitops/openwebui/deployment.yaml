# =============================================================================
# Open WebUI
#
# Single UI for both model backends:
#   - Ollama/TinyLlama:  http://ollama:11434  (CPU demo)
#   - vLLM/Qwen2.5-7B:  http://vllm:8000    (GPU demo)
#
# During the demo, switch between models in the UI dropdown. Both are served
# from the same OpenWebUI instance - one public IP, two backends.
#
# Demo talking point: same user experience regardless of the backend.
# The infrastructure difference (CPU vs GPU) is invisible to the end user.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openwebui
  namespace: ai-demos
  labels:
    app: openwebui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openwebui
  template:
    metadata:
      labels:
        app: openwebui
    spec:
      containers:
        - name: openwebui
          image: ghcr.io/open-webui/open-webui:main
          ports:
            - containerPort: 8080
          env:
            - name: OLLAMA_BASE_URL
              value: "http://ollama:11434"
            - name: OPENAI_API_BASE_URL
              value: "http://vllm-serv:8000/v1"
            - name: OPENAI_API_KEY
              value: "not-required"
            - name: WEBUI_AUTH
              value: "false"
            # Disable RAG embedding model download - not needed for this demo
            # Without this OpenWebUI tries to pull sentence-transformers from
            # HuggingFace on startup which takes minutes and crashes the probe
            - name: RAG_EMBEDDING_ENGINE
              value: "ollama"
            - name: RAG_OLLAMA_BASE_URL
              value: "http://ollama:11434"
            - name: ENABLE_RAG_WEB_SEARCH
              value: "false"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 120    # was 30 - give it time to start
            periodSeconds: 15
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 90     # was 15
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: webui-data
              mountPath: /app/backend/data
      volumes:
        - name: webui-data
          emptyDir: {}

# Public LoadBalancer - this is the single URL you give to demo attendees.
# Azure provisions a public IP automatically. Get it with:
#   kubectl get svc openwebui -n ai-demos
apiVersion: v1
kind: Service
metadata:
  name: openwebui
  namespace: ai-demos
  labels:
    app: openwebui
spec:
  type: LoadBalancer
  selector:
    app: openwebui
  ports:
    - name: http
      port: 80
      targetPort: 8080

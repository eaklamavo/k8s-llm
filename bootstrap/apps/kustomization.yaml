# to enable pulling in and consolidating resources
#
# Follow steps defined on /bootstrap/README.md to configure ssh key on git and secret in K8s. 
#
# Apply this kustomization.yaml to deploy the ai-demo or the /bootstrap/argocd-apps-kustomization.yaml
#
# kubectl apply -k .

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - app-of-apps.yaml
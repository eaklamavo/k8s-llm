################################################################
# Argo CD will need access to the repository.
# to enable pulling in and consolidating resources.
#
# Follow steps defined on /bootstrap/README.md to configure ssh key on git and secret in K8s. 
#
# Apply this kustomization.yaml to deploy the ai-demo (this will deploy the app-of-apps):
#
# kubectl apply -f argocd-apps-kustomization.yaml
################################################################


---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: argocd-apps
  namespace: flux-system
spec:
  interval: 5m
  path: ./bootstrap/apps
  prune: true
  sourceRef:
    kind: GitRepository
    name: fc-cnandk8s-sbox-swec-01
  dependsOn:
    - name: fc-cnandk8s-sbox-swec-01-bootstrap
  timeout: 5m